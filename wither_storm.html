<script>
/*
  WITHER STORM — a top-down fan game inspired by Minecraft: Story Mode.
  Single file, no assets: all art is procedural pixel art, all audio is Web Audio synthesis.
*/
(() => {
'use strict';

// =====================================================================
// CONFIG
// =====================================================================

  STAMINA_MAX: 100, STAMINA_DRAIN: 30, STAMINA_REGEN: 15,

  SKULL_SPEED: 900, SKULL_CD_EARLY: 0.7, SKULL_CD_LATE: 0.35, SKULL_RANGE_BASE: 620,

  PASSIVE_POWER: 22, PASSIVE_POWER_R: 2.4, BEAM_POWER: 120, BEAM_POWER_R: 5,
  CONTACT_DPS: 120, CONTACT_DPS_R: 3,

const TILE = CFG.TILE, WT = CFG.WT, WORLD_PX = TILE * WT, CH = CFG.CHUNK, CHN = WT / CH, CHPX = CH * TILE;
const TAU = Math.PI * 2;

const COL = Object.freeze({
  body: '#08050d', shadow: '#1b0d2a', flesh: '#5b1fa8', glow: '#a24dff', eye: '#e0b3ff',
  flame: '#ff7a3d', flash: '#ffffff', bg: '#05030a',
  hudBg: 'rgba(12,6,20,0.80)', hudEdge: '#6a2fc0', text: '#f0e6ff', dim: '#9a86b8',
  good: '#7dff9a', bad: '#ff4d6d', warn: '#ffcc4d', jesse: '#ffd23f',
  cb: '#c47a3c', cbDark: '#6e3f1c', cbLine: '#3b2210',

// Phase progression (Mass Units). Sub-phases are labels; radii interpolate between majors.
const PHASE_A = [
  { p: 0, mu: 0, name: 'THE WITHER' },
  { p: 1, mu: 60, name: 'THE AWAKENING' },
  { p: 1.1, mu: 85 }, { p: 1.2, mu: 130 },
  { p: 2, mu: 200, name: 'THE HUNGER' },
  { p: 3, mu: 450, name: 'THE HIDDEN HEART' },
  { p: 3.1, mu: 520 }, { p: 3.2, mu: 600 },
  { p: 4, mu: 900, name: 'THE DESTROYER' },
  { p: 4.5, mu: 1200 },
  { p: 5, mu: 1500, name: 'THE BEHEMOTH' },
  { p: 5.25, mu: 1850 },
  { p: 5.5, mu: 2200, name: 'FORMIDIBOMBABLE' },
];
const PHASE_B = [
  { p: 6, mu: 2200, name: 'THE TRINITY' },
  { p: 7, mu: 3200, name: 'THE APEX' },
  { p: 7.5, mu: 3350, name: 'THE WOUND OPENS' },
];
const RADIUS_A = [[0, 30], [60, 44], [200, 62], [450, 84], [900, 118], [1500, 158], [2200, 178]];
const RADIUS_B = [[2200, 200], [3200, 224], [3350, 230], [4200, 236]];
const PROGENY_R = 90;

// Per-head identity.
const HEADS = [
  { label: '1', range: 1.0, bw: 11, pull: 1.0, dmg: 1.3, cd: 1.15, size: 0.40, eye: '#c77dff', eyeGlow: [200, 120, 255], off: 0, dist: 0.62 },
  { label: '2', range: 0.85, bw: 9, pull: 0.8, dmg: 1.0, cd: 0.72, size: 0.30, eye: '#ff5c7c', eyeGlow: [255, 80, 120], off: -0.85, dist: 0.60 },
  { label: '3', range: 1.35, bw: 7, pull: 0.85, dmg: 0.9, cd: 1.0, size: 0.30, eye: '#8a8cff', eyeGlow: [130, 130, 255], off: 0.85, dist: 0.60 },
];

// Mass unit values for entities.
const MU_ANIMAL = 3, MU_MOB = 5, MU_NPC = 10;

const GAME_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyV', 'KeyE', 'Digit1', 'Digit2', 'Digit3',
  'ShiftLeft', 'ShiftRight', 'KeyP', 'KeyR', 'KeyM', 'F3', 'KeyH', 'KeyN', 'Space', 'Enter', 'Escape',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'KeyQ']);

// =====================================================================
// UTILS / RNG
// =====================================================================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(d2(ax, ay, bx, by));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const lerpAngle = (a, b, t) => a + angDiff(a, b) * t;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let wrnd = mulberry32(CFG.SEED);          // world generation RNG
let rnd = mulberry32(CFG.SEED ^ 0x5eed);  // gameplay RNG (reseeded on restart)
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(a + (b - a + 1) * rnd());
const wr = (a, b) => a + (b - a) * wrnd();
const wi = (a, b) => Math.floor(a + (b - a + 1) * wrnd());
function hash2(x, y, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct) {
  let t = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { t += vnoise(x * f, y * f, s + i * 17) * amp; n += amp; amp *= 0.5; f *= 2; }
  return t / n;
}
function interpTable(tab, x) {
  if (x <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) {
    if (x <= tab[i][0]) { const a = tab[i - 1], b = tab[i]; return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0])); }
  }
  return tab[tab.length - 1][1];
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

// =====================================================================
// INPUT
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const keys = Object.create(null);
const pressed = Object.create(null);
const mouse = { x: 0, y: 0, left: false, right: false, clicked: false };
let anyKeyPressed = false;

function onKeyDown(e) {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  if (!e.repeat) { pressed[e.code] = true; anyKeyPressed = true; }
  keys[e.code] = true;
  Snd.init();
}
function onKeyUp(e) { if (GAME_KEYS.has(e.code)) e.preventDefault(); keys[e.code] = false; }
function releaseAll() { for (const k in keys) keys[k] = false; mouse.left = mouse.right = false; }
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
canvas.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (e.button === 0) { mouse.left = true; mouse.clicked = true; }
  if (e.button === 2) mouse.right = true;
  anyKeyPressed = true; Snd.init(); canvas.focus();
});
window.addEventListener('mouseup', (e) => { if (e.button === 0) mouse.left = false; if (e.button === 2) mouse.right = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
const held = (c) => !!keys[c];
function consumePressed(c) { if (pressed[c]) { pressed[c] = false; return true; } return false; }
function clearPressed() { for (const k in pressed) pressed[k] = false; mouse.clicked = false; anyKeyPressed = false; }

// =====================================================================
// AUDIO (Web Audio synthesis, created after first input)
// =====================================================================
const Snd = {
  ctx: null, master: null, sfx: null, muted: false, noiseBuf: null, loops: null, popBudget: 0, lastT: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.55;
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 5;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.master);
      const len = this.ctx.sampleRate * 2;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.startLoops();
    } catch (err) { this.ctx = null; }
  },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.55, this.ctx.currentTime, 0.05);
  },
  startLoops() {
    if (!this.ctx) return;
    const c = this.ctx, L = {};
    L.droneGain = c.createGain(); L.droneGain.gain.value = 0;
    L.droneFilter = c.createBiquadFilter(); L.droneFilter.type = 'lowpass'; L.droneFilter.frequency.value = 160;
    L.o1 = c.createOscillator(); L.o1.type = 'sawtooth'; L.o1.frequency.value = 41;
    L.o2 = c.createOscillator(); L.o2.type = 'sawtooth'; L.o2.frequency.value = 41.6;
    L.o1.connect(L.droneFilter); L.o2.connect(L.droneFilter);
    L.nz = c.createBufferSource(); L.nz.buffer = this.noiseBuf; L.nz.loop = true;
    L.nzFilter = c.createBiquadFilter(); L.nzFilter.type = 'bandpass'; L.nzFilter.frequency.value = 220; L.nzFilter.Q.value = 0.8;
    L.nzGain = c.createGain(); L.nzGain.gain.value = 0.25;
    L.nz.connect(L.nzFilter); L.nzFilter.connect(L.nzGain); L.nzGain.connect(L.droneFilter);
    L.droneFilter.connect(L.droneGain); L.droneGain.connect(this.master);
    L.humGain = c.createGain(); L.humGain.gain.value = 0;
    L.humFilter = c.createBiquadFilter(); L.humFilter.type = 'lowpass'; L.humFilter.frequency.value = 700;
    L.h1 = c.createOscillator(); L.h1.type = 'sawtooth'; L.h1.frequency.value = 70;
    L.h2 = c.createOscillator(); L.h2.type = 'sine'; L.h2.frequency.value = 140;
    L.h1.connect(L.humFilter); L.h2.connect(L.humFilter); L.humFilter.connect(L.humGain); L.humGain.connect(this.master);
    [L.o1, L.o2, L.nz, L.h1, L.h2].forEach((n) => n.start());
    this.loops = L;
  },
  stopLoops() {
    const L = this.loops; if (!L) return;
    [L.o1, L.o2, L.nz, L.h1, L.h2].forEach((n) => { try { n.stop(); n.disconnect(); } catch (e) { /* already stopped */ } });
    [L.droneGain, L.humGain, L.droneFilter, L.humFilter, L.nzGain, L.nzFilter].forEach((n) => { try { n.disconnect(); } catch (e) { /* ignore */ } });
    this.loops = null;
  },
  reset() { if (!this.ctx) return; this.stopLoops(); this.startLoops(); },
  update(dt, stageC, beamStrength, intensity) {
    if (!this.ok() || !this.loops) return;
    this.popBudget = Math.min(14, this.popBudget + dt * 14);
    const L = this.loops, t = this.ctx.currentTime;
    L.droneGain.gain.setTargetAtTime(0.10 + 0.05 * stageC * intensity, t, 0.3);
    L.droneFilter.frequency.setTargetAtTime(120 + stageC * 40, t, 0.4);
    L.o2.frequency.setTargetAtTime(41.6 + stageC * 0.4, t, 0.5);
    L.humGain.gain.setTargetAtTime(beamStrength > 0 ? 0.05 + beamStrength * 0.1 : 0, t, 0.08);
    L.h1.frequency.setTargetAtTime(60 + beamStrength * 70, t, 0.15);
    L.h2.frequency.setTargetAtTime(120 + beamStrength * 150, t, 0.15);
  },
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, ftype, q, delay, freqEnd) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.5 + Math.random();
    const f = c.createBiquadFilter(); f.type = ftype || 'lowpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q || 1;
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  boom(size, vol) {
    const v = (vol === undefined ? 1 : vol);
    if (v < 0.03) return;
    this.noise(0.5 + size * 0.5, 0.7 * v, 900, 'lowpass', 0.7, 0, 60);
    this.tone(90, 0.4 + size * 0.3, 'sine', 0.6 * v, 30);
  },
  pop() { if (this.popBudget < 1) return; this.popBudget -= 1; this.tone(300 + Math.random() * 500, 0.06, 'square', 0.05, 120); },
  crunch() { this.noise(0.18, 0.4, 1800, 'bandpass', 2); this.tone(140, 0.15, 'square', 0.12, 60); },
  whoosh() { this.noise(0.25, 0.18, 600, 'bandpass', 1.5, 0, 2400); },
  sting() { [0, 0.12, 0.24].forEach((d, i) => this.tone([196, 233, 294][i], 0.6, 'sawtooth', 0.12, null, d)); this.roar(); },
  roar() { this.noise(1.4, 0.45, 300, 'lowpass', 3, 0, 90); this.tone(70, 1.2, 'sawtooth', 0.2, 40); this.tone(104, 1.1, 'sawtooth', 0.12, 55); },
  beep(hi) { this.tone(hi ? 1320 : 880, 0.09, 'square', 0.12); },
  heartbeat() { this.tone(60, 0.18, 'sine', 0.5, 40); this.tone(55, 0.18, 'sine', 0.4, 38, 0.22); },
  chime() { this.tone(988, 0.2, 'triangle', 0.12); this.tone(1319, 0.3, 'triangle', 0.1, null, 0.09); },
  scream() { this.tone(700 + Math.random() * 300, 0.35, 'sawtooth', 0.04, 400); },
  hurt() { this.tone(220, 0.12, 'square', 0.08, 110); },
  click() { this.tone(660, 0.05, 'square', 0.06); },
};

const MATS = [{ id: 0, key: 'none', layer: 1, hp: 0, mu: 0 }];

// ---- block layer ----
const B_STONE = defMat('stone', { tex: 'stone', c1: '#7d7d7d', c2: '#6a6a6a', c3: '#555555', hp: 60 });
const B_COBBLE = defMat('cobble', { tex: 'cobble', c1: '#8a8a8a', c2: '#6c6c6c', c3: '#3f3f3f', hp: 70, mu: 1.5 });

const B_STONEBRICK = defMat('stonebrick', { tex: 'stonebrick', c1: '#8c8c8c', c2: '#7a7a7a', c3: '#4a4a4a', hp: 80, mu: 1.5 });
const B_SANDSTONE = defMat('sandstone', { tex: 'sandstone', c1: '#e0d29a', c2: '#cfc085', c3: '#b8a86e', hp: 45 });

function genTex(m, rng) {
  const c = makeCanvas(16, 16), g = c.getContext('2d'), img = g.createImageData(16, 16), d = img.data;

    const i = (y * 16 + x) * 4, vv = v || 0;

    d[i + 3] = a === undefined ? 255 : a;
  };
  const nz = (a) => (rng() * 2 - 1) * a;
  const fillNoise = (rgb, amp) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) set(x, y, rgb, nz(amp)); };
  switch (m.tex) {
    case 'noise': fillNoise(base, m.amp); for (let k = 0; k < 40; k++) set(Math.floor(rng() * 16), Math.floor(rng() * 16), alt, nz(8)); break;
    case 'grass': case 'flowers':
      fillNoise(base, 10);
      for (let k = 0; k < 34; k++) { const x = Math.floor(rng() * 16), y = Math.floor(rng() * 15); set(x, y, alt, nz(10)); set(x, y + 1, alt, -12); }
      if (m.tex === 'flowers') {
        const fc = [[230, 40, 40], [250, 220, 60], [90, 120, 250], [250, 250, 250], [230, 110, 200]];
        for (let k = 0; k < 5; k++) {
          const x = 1 + Math.floor(rng() * 14), y = 1 + Math.floor(rng() * 14), col = fc[Math.floor(rng() * fc.length)];
          set(x, y, [250, 230, 90]); set(x - 1, y, col); set(x + 1, y, col); set(x, y - 1, col); set(x, y + 1, col);
        }
      }
      break;
    case 'water':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const w = Math.sin((x + y * 0.5) * 0.8) + Math.sin((x * 0.5 - y) * 0.9);
        set(x, y, w > 1.2 ? alt : base, nz(6));
      }
      break;
    case 'gravel':
      fillNoise(base, 14);
      for (let k = 0; k < 30; k++) { const x = Math.floor(rng() * 16), y = Math.floor(rng() * 16); set(x, y, rng() < 0.5 ? alt : dark, nz(10)); }
      break;
    case 'farm':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) set(x, y, (y % 4) < 2 ? dark : base, nz(8));
      for (let y = 0; y < 16; y += 4) for (let x = 0; x < 16; x++) if (rng() < 0.7) { set(x, y, alt, nz(20)); if (rng() < 0.5) set(x, y + 1, alt, -30); }
      break;
    case 'slab':
      fillNoise(base, 5);
      for (let i = 0; i < 16; i++) { set(i, 0, base, 18); set(0, i, base, 18); set(i, 15, alt, -10); set(15, i, alt, -10); set(i, 8, alt, -6); }
      break;
    case 'planks':
      for (let y = 0; y < 16; y++) {
        const row = y >> 2, seam = (row * 7 + 3) % 16;
        for (let x = 0; x < 16; x++) {
          let col = (y % 4 === 3) ? dark : ((x + row * 5) % 7 === 0 ? alt : base);
          set(x, y, col, nz(7) + (x === seam ? -35 : 0));
        }
      }
      break;
    case 'log':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const dd = Math.sqrt((x - 7.5) * (x - 7.5) + (y - 7.5) * (y - 7.5));
        if (dd > 6.6) set(x, y, dark, nz(12)); else set(x, y, Math.floor(dd) % 2 ? alt : base, nz(6));
      }
      break;
    case 'leaves':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const r = rng();
        if (r < 0.05) set(x, y, dark, 0, 0); else set(x, y, r < 0.35 ? alt : base, nz(16));
      }
      break;
    case 'bricks':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const row = y >> 2, off = (row % 2) * 4;
        const mortar = (y % 4 === 0) || ((x + off) % 8 === 0);
        set(x, y, mortar ? dark : ((row + ((x + off) >> 3)) % 2 ? alt : base), nz(mortar ? 5 : 9));
      }
      break;
    case 'stonebrick':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const row = y >> 3, off = row ? 4 : 0;
        const mortar = (y % 8 === 0) || ((x + off) % 8 === 0);
        set(x, y, mortar ? dark : base, nz(mortar ? 4 : 10));
      }
      for (let k = 0; k < 5; k++) set(Math.floor(rng() * 16), Math.floor(rng() * 16), dark, 10);
      break;
    case 'sandstone':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) set(x, y, (y === 4 || y === 12) ? dark : (y < 3 ? alt : base), nz(5));
      break;
    case 'diorite':
      fillNoise(base, 6);
      for (let k = 0; k < 50; k++) set(Math.floor(rng() * 16), Math.floor(rng() * 16), alt, nz(10));
      break;
    case 'wool':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) set(x, y, base, nz(7) + ((x + y) % 4 === 0 ? -14 : 0) + ((x - y + 16) % 5 === 0 ? 8 : 0));
      break;
    case 'diamond':
      fillNoise(base, 8);
      for (let i = 0; i < 16; i++) { set(i, 0, alt); set(0, i, alt); set(i, 15, dark); set(15, i, dark); }
      for (let k = 0; k < 10; k++) { const x = 2 + Math.floor(rng() * 12), y = 2 + Math.floor(rng() * 12); set(x, y, alt); set(x + 1, y + 1, dark); }
      break;
    case 'obsidian':
      fillNoise(base, 5);
      for (let k = 0; k < 26; k++) set(Math.floor(rng() * 16), Math.floor(rng() * 16), alt, nz(10));
      for (let k = 0; k < 5; k++) { const x = Math.floor(rng() * 14), y = Math.floor(rng() * 14); set(x, y, dark, 30); set(x + 1, y + 1, dark, 10); }
      break;
    case 'tnt':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const band = y >= 5 && y <= 10;
        set(x, y, band ? alt : ((x % 4 === 0) ? dark : base), nz(6));
      }
      // tiny "TNT" glyphs
      [[2, 6], [3, 6], [4, 6], [3, 7], [3, 8], [3, 9], [6, 6], [6, 7], [6, 8], [6, 9], [7, 7], [8, 8], [9, 6], [9, 7], [9, 8], [9, 9],
        [11, 6], [12, 6], [13, 6], [12, 7], [12, 8], [12, 9]].forEach(([x, y]) => set(x, y, [20, 20, 20]));
      break;
    case 'redstone':
      fillNoise(base, 14);
      for (let k = 0; k < 30; k++) set(Math.floor(rng() * 16), Math.floor(rng() * 16), rng() < 0.5 ? alt : dark, nz(10));
      break;
    case 'lamp':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const edge = x < 2 || y < 2 || x > 13 || y > 13;
        const dd = Math.abs(x - 7.5) + Math.abs(y - 7.5);
        set(x, y, edge ? dark : (dd < 5 ? alt : base), nz(10));
      }
      break;
    case 'iron':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) set(x, y, (x === 0 || y === 15) ? dark : (x % 5 === 0 ? alt : base), nz(4));
      break;
    case 'glass':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const edge = x === 0 || y === 0 || x === 15 || y === 15;
        const hl = (x - y === 4 || x - y === 5) && x > 3 && x < 12;
        set(x, y, edge ? [240, 250, 255] : base, 0, edge ? 230 : (hl ? 200 : 70));
      }
      break;
    case 'portal':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const a = Math.atan2(y - 7.5, x - 7.5), r = Math.sqrt((x - 7.5) ** 2 + (y - 7.5) ** 2);
        set(x, y, Math.sin(a * 2 + r * 0.9) > 0.2 ? alt : base, nz(14));
      }
      break;
    case 'soulsand':
      fillNoise(base, 10);
      for (let k = 0; k < 3; k++) { const x = 2 + Math.floor(rng() * 10), y = 2 + Math.floor(rng() * 10); set(x, y, dark); set(x + 3, y, dark); set(x + 1, y + 3, dark); set(x + 2, y + 3, dark); }
      break;
    case 'hay':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) set(x, y, (y === 3 || y === 12) ? dark : (x % 3 === 0 ? alt : base), nz(10));
      break;
    case 'fence':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const post = x >= 6 && x <= 9 && y >= 5 && y <= 10;
        const rail = (y === 7 || y === 8);
        if (post) set(x, y, (x === 9 || y === 10) ? alt : base, nz(8)); else if (rail) set(x, y, base, nz(8) - 10); else set(x, y, base, 0, 0);

      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const inner = x > 3 && x < 12 && y > 3 && y < 12;
        set(x, y, inner ? alt : base, nz(7) + ((x === 3 || y === 3 || x === 12 || y === 12) ? -40 : 0));
      }
      break;
    case 'dispenser':
      fillNoise(base, 12);
      for (let y = 5; y < 11; y++) for (let x = 5; x < 11; x++) set(x, y, dark, nz(6));
      for (let i = 0; i < 16; i++) { set(i, 0, alt); set(0, i, alt); }
      break;
    case 'command':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {

function genCrack(level, rng) {
  const c = makeCanvas(16, 16), g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.55)';
  const n = level === 1 ? 2 : 5;
  for (let k = 0; k < n; k++) {
    let x = 4 + rng() * 8, y = 4 + rng() * 8;
    for (let s = 0; s < 6 + level * 3; s++) { g.fillRect(Math.floor(x), Math.floor(y), 1, 1); x += rng() * 3 - 1.5; y += rng() * 3 - 1.5; x = clamp(x, 0, 15); y = clamp(y, 0, 15); }
  }
  return c;
}
function genRubble(rng) {
  const c = makeCanvas(16, 16), g = c.getContext('2d');
  for (let k = 0; k < 9; k++) {
    const v = 60 + Math.floor(rng() * 70);
    g.fillStyle = 'rgb(' + v + ',' + (v - 5) + ',' + (v - 10) + ')';
    g.fillRect(Math.floor(rng() * 14), Math.floor(rng() * 14), 1 + Math.floor(rng() * 2), 1 + Math.floor(rng() * 2));
  }
  return c;
}
function genGlow() {
  const c = makeCanvas(64, 64), g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  gr.addColorStop(0.6, 'rgba(255,255,255,0.15)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return c;
}
function glowSprite(rgb) {
  const key = rgb[0] * 65536 + rgb[1] * 256 + rgb[2];
  let s = glowCache.get(key);
  if (!s) {
    s = makeCanvas(64, 64); const g = s.getContext('2d');
    g.drawImage(GLOW, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = rgba(rgb, 1); g.fillRect(0, 0, 64, 64);
    glowCache.set(key, s);
  }
  return s;
}

const NT = WT * WT;
const ground = new Uint8Array(NT), block = new Uint8Array(NT), thp = new Float32Array(NT), flags = new Uint8Array(NT);
const F_SCORCH = 1, F_RUBBLE = 2, F_BURN = 4, F_STRUCT = 8, F_LIT = 16;
const tidx = (x, y) => y * WT + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < WT && y < WT;
const LOC = {
  endercon: { x: 320, y: 560, r: 44, name: 'EnderCon' },
  gabriel: { x: 452, y: 452, r: 33, name: "Gabriel's Fortress" },
  boom: { x: 112, y: 340, r: 37, name: 'Boom Town' },
  redstonia: { x: 530, y: 250, r: 37, name: 'Redstonia' },
  soren: { x: 320, y: 92, r: 42, name: "Soren's Fortress" },

const MAP_LABELS = [{ x: 262, y: 612, name: "JESSE'S TREEHOUSE" }, { x: 320, y: 14, name: 'THE FAR LANDS' }, { x: 112, y: 258, name: 'BADLANDS' }];
const FARLANDS_Y = 34;
const VILLAGES = [[170, 480], [420, 600], [540, 560], [380, 380], [290, 330], [160, 220], [420, 180], [600, 140], [60, 520], [300, 450], [500, 360], [180, 600], [60, 180], [560, 440]];

function gSet(x, y, m) { if (inb(x, y)) ground[tidx(x, y)] = m; }
function bSet(x, y, m, st) {
  if (!inb(x, y)) return;
  const i = tidx(x, y);
  if (ground[i] === G_WATER && m && m !== B_FENCE) ground[i] = G_PLANKFLOOR;
  block[i] = m; thp[i] = m ? MATS[m].hp : 0;
  flags[i] = (flags[i] & ~(F_RUBBLE | F_STRUCT)) | (st && m ? F_STRUCT : 0);
}
function fillG(x0, y0, w, h, m) { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) gSet(x, y, m); }
function fillB(x0, y0, w, h, m) { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) bSet(x, y, m, true); }

function clearDisc(cx, cy, r, gm) {

    const i = tidx(x, y); block[i] = 0; thp[i] = 0; flags[i] = 0;

}
function discG(cx, cy, r, m) { for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) gSet(x, y, m); }
function spawnAt(type, tx, ty, extra) { SPAWNS.push(Object.assign({ type, x: tx * TILE + 8, y: ty * TILE + 8 }, extra || {})); }
function spawnRing(type, cx, cy, r0, r1, n, extra) {

}
const WOOLS = () => [B_WOOL_R, B_WOOL_Y, B_WOOL_W, B_WOOL_G, B_WOOL_P, B_WOOL_O, B_BLUEWOOL];

function tree(x, y) {
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    if (Math.abs(dx) === 2 && Math.abs(dy) === 2) continue;
    const tx = x + dx, ty = y + dy; if (!inb(tx, ty)) continue;
    const i = tidx(tx, ty);
    if (ground[i] === G_WATER || (block[i] && block[i] !== B_LEAVES)) continue;
    block[i] = B_LEAVES; thp[i] = MATS[B_LEAVES].hp;

  if (inb(x, y) && ground[tidx(x, y)] !== G_WATER) { const i = tidx(x, y); block[i] = B_LOG; thp[i] = MATS[B_LOG].hp; }

function riverPath(pts, width) {
  for (let s = 0; s < pts.length - 1; s++) {
    const [ax, ay] = pts[s], [bx, by] = pts[s + 1], L = Math.hypot(bx - ax, by - ay);
    for (let k = 0; k <= L * 2; k++) {
      const t = k / (L * 2), x = lerp(ax, bx, t), y = lerp(ay, by, t);
      const w = width + Math.sin((x + y) * 0.07) * 1.2;
      for (let dy = -w - 3; dy <= w + 3; dy++) for (let dx = -w - 3; dx <= w + 3; dx++) {
        const tx = Math.round(x + dx), ty = Math.round(y + dy); if (!inb(tx, ty)) continue;
        const dd = Math.sqrt(dx * dx + dy * dy), i = tidx(tx, ty);

function roadPath(pts, width, mat, seed) {

        const tx = Math.round(x + dx), ty = Math.round(y + dy); if (!inb(tx, ty)) continue;
        const i = tidx(tx, ty);

}

function genTerrain() {
  const bx = LOC.boom.x, by = LOC.boom.y;
  for (let y = 0; y < WT; y++) for (let x = 0; x < WT; x++) {
    const i = tidx(x, y);
    block[i] = 0; thp[i] = 0; flags[i] = 0;
    let g = G_GRASS;
    if (fbm(x / 22, y / 22, 9, 2) > 0.7) g = G_DIRT;
    if (fbm(x / 26, y / 26, 13, 2) > 0.7) g = G_FLOWERS;
    ground[i] = g;
    // The Far Lands: glitched, ribbed stone walls at the northern edge of the world (Soren's home)
    if (y < FARLANDS_Y) {
      ground[i] = G_GRAVEL;
      const rib = (x % 9) < 6 || y < 10;
      const hole = y > 8 && vnoise(x / 3.5, y / 7, 71) > 0.64;
      if (rib && !hole) {
        const r = hash2(x, y, 77);
        const m = y % 6 === 0 ? B_COBBLE : r < 0.05 ? B_ORE : (((x >> 1) + y) % 13 === 0 ? B_SANDSTONE : B_STONE);
        block[i] = m; thp[i] = MATS[m].hp;
      }

    }
    // Badlands (mesa) around Boom Town
    const bd = Math.hypot(x - bx, y - by) + (vnoise(x / 14, y / 14, 61) - 0.5) * 34;
    if (bd < 95) {
      ground[i] = hash2(x, y, 63) < 0.025 ? G_DEADBUSH : G_REDSAND;
      const mesa = fbm(x / 26, y / 26, 62, 3);
      if (mesa > 0.6 && bd > 44) { const band = Math.floor(mesa * 30) % 3; const m = band === 0 ? B_TERRA : band === 1 ? B_TERRA2 : B_TERRA3; block[i] = m; thp[i] = MATS[m].hp; }
      else if (bd > 44 && hash2(x, y, 64) < 0.01) { block[i] = B_CACTUS; thp[i] = MATS[B_CACTUS].hp; }
      continue;
    }
    // mountains towards the north and along the west/east edges
    const mnt = fbm(x / 60, y / 60, 7, 4) + clamp((170 - y) / 120, 0, 1) * 0.55 + clamp((24 - x) / 40, 0, 1) * 0.2 + clamp((x - WT + 24) / 40, 0, 1) * 0.2;
    if (mnt > 0.8) {
      const r = hash2(x, y, 99);
      block[i] = r < 0.04 ? B_ORE : r < 0.12 ? B_COBBLE : B_STONE; thp[i] = MATS[block[i]].hp; ground[i] = G_GRAVEL;
    } else if (mnt > 0.74) ground[i] = G_GRAVEL;

  const west = [], east = [];
  for (let y = 150; y <= WT + 8; y += 8) west.push([232 + Math.sin(y / 31) * 10 + (vnoise(y / 40, 1, 5) - 0.5) * 10, y]);
  for (let y = 330; y <= WT + 8; y += 8) east.push([600 + Math.sin(y / 23) * 8, y]);
  riverPath(west, 3.4); riverPath(east, 2.8);
  for (let y = 530; y < 592; y++) for (let x = 55; x < 127; x++) {
    const dd = Math.hypot(x - 90, (y - 560) * 1.3) + (vnoise(x / 6, y / 6, 3) - 0.5) * 6, i = tidx(x, y);
    if (dd < 16) { ground[i] = G_WATER; block[i] = 0; } else if (dd < 18.5 && ground[i] !== G_WATER) ground[i] = G_SAND;
  }

    }

function genRoads() {

  const R = (a, b, w, m, s) => roadPath([[a.x, a.y], [b.x, b.y]], w, m, s);
  R(L.endercon, L.gabriel, 4, G_GRAVEL, 11);

function genNetherRail() {
  const pts = [[149, 341], [200, 332], [262, 312], [340, 292], [420, 272], [493, 251]];
  const path = [];
  for (let s = 0; s < pts.length - 1; s++) {
    const [ax, ay] = pts[s], [bx, by] = pts[s + 1], L = Math.ceil(Math.hypot(bx - ax, by - ay));

      if (k % 3 === 0) path.push([x * TILE + 8, (y + 1) * TILE]);

}

function genEnderCon() {

  updateCamera(rawDt);
  const s = G.storm;
  const targetDark = G.mode === 'bowels' ? 0.1 : (G.state === 'title' ? 0.3 : (s.stageC < 5 ? s.stageC * 0.03 : 0.15 + (s.stageC - 5) * 0.2));
  G.darkness = lerp(G.darkness, clamp(targetDark, 0, 0.66), Math.min(1, rawDt * 0.8));
  Snd.update(rawDt, G.mode === 'bowels' ? 7 : s.stageC, (G.mode === 'bowels' ? (G.bw && G.bw.beam ? 1 : 0) : s.beamStrength), G.state === 'title' ? 0.3 : 1);
}
function render() {
  if (G.mode === 'bowels') renderBowelsScene(); else renderWorldScene();
  drawHUD();
  renderOverlays();
}

// =====================================================================
// MAIN LOOP
// =====================================================================
let lastT = performance.now(), accum = 0, fpsAcc = 0, fpsFrames = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = CFG.STEP;
  if (dt > CFG.MAX_FRAME) dt = CFG.MAX_FRAME;
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) { G.fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; }
  handleFrameInput();
  if (!G.paused) {
    accum += dt;
    let steps = 0;
    while (accum >= CFG.STEP && steps < CFG.MAX_STEPS) { step(CFG.STEP); accum -= CFG.STEP; steps++; }
    if (steps >= CFG.MAX_STEPS) accum = 0;
  } else { G.mouseWorld = screenToWorld(mouse.x, mouse.y); }
  try { render(); } catch (err) { console.error(err); }
  clearPressed();
}
function boot() {
  resize();
  mouse.x = cssW / 2; mouse.y = cssH / 2;
  buildTextures();
  fleshPattern = ctx.createPattern(FLESH_PATTERN_CANVAS, 'repeat');
  newGame('title');
  canvas.focus();
  requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(frame); });
}
// Test hook (read-only access for automated playtests; not used by the game itself)
window.__WS = { get G() { return G; }, newGame, addMass: (m) => addMass(m), startFbomb: () => startFbomb(), startBowels: () => startBowels() };
boot();
})();
</script>
